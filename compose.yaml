# Local development dependencies only. API, worker and UI run on the host. Startup unverified (M1-Docker).
services:
  mongo:
    image: mongo:8.0.15
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.6
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set a local development password in .env}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/operations-import-desk-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  mongo-data:
  redis-data:
  keycloak-data:
